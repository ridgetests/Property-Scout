name: Build map file (precise plot sizes)

# Press "Run workflow" on this to fetch OS Open UPRN and (re)build the map file
# uprn_coords.json.gz, which gives precise plot sizes. Run it on the main branch.
# Manual-only - it never runs on its own.
#
# The house-size file (epc_region.json.gz) is NOT built here: the government moved
# the EPC bulk service behind a login, so it can't be fetched automatically. Build
# it via the "Build house-size file from upload" workflow instead (see
# epc_upload/README.md).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the map file (precise plot sizes)
        env:
          OS_API_KEY: ${{ secrets.OS_API_KEY }}
        run: python fetch_uprn.py

      - name: Save it into the project
        run: |
          if [ ! -f uprn_coords.json.gz ]; then
            echo "No map file was built - check the step above."; exit 1
          fi
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add uprn_coords.json.gz
          git commit -m "Build map file (uprn_coords.json.gz)" || echo "no changes"
          git push || echo "push skipped"
          echo "Saved uprn_coords.json.gz"
